<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NEON ASSAULT</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Courier New', monospace;
  }
  #gameWrapper {
    position: relative;
    width: 480px;
    height: 800px;
  }
  canvas {
    display: block;
    width: 480px;
    height: 800px;
    image-rendering: pixelated;
  }
  #backBtn {
    position: absolute;
    top: 8px;
    left: 8px;
    color: rgba(0,255,255,0.5);
    text-decoration: none;
    font-size: 11px;
    font-family: 'Courier New', monospace;
    z-index: 10;
    padding: 2px 6px;
    border: 1px solid rgba(0,255,255,0.3);
    background: rgba(0,0,0,0.5);
    transition: color 0.2s, border-color 0.2s;
  }
  #backBtn:hover { color: #0ff; border-color: #0ff; }

  @media (max-height: 820px) {
    #gameWrapper { transform: scale(0.9); transform-origin: center center; }
  }
  @media (max-height: 740px) {
    #gameWrapper { transform: scale(0.8); transform-origin: center center; }
  }
  @media (max-width: 500px) {
    #gameWrapper { transform: scale(0.95); transform-origin: center center; }
  }
</style>
</head>
<body>
<div id="gameWrapper">
  <canvas id="c" width="480" height="800"></canvas>
  <a href="index.html" id="backBtn">&#8592; BACK</a>
</div>
<script>
// =============================================================
// NEON ASSAULT — Vertical Bullet-Hell Shoot-em-up
// =============================================================

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var W = 480, H = 800;

// =============================================================
// UTILITIES
// =============================================================
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function rand(lo, hi) { return lo + Math.random() * (hi - lo); }
function randInt(lo, hi) { return Math.floor(rand(lo, hi + 1)); }
function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }
function angTo(ax, ay, bx, by) { return Math.atan2(by - ay, bx - ax); }

function glow(color, size) {
  ctx.shadowColor = color;
  ctx.shadowBlur = size;
}
function noGlow() {
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
}

// =============================================================
// INPUT
// =============================================================
var keys = {};
var mouse = { x: W / 2, y: H - 150, down: false, rightDown: false };

canvas.addEventListener('mousemove', function(e) {
  var r = canvas.getBoundingClientRect();
  var scaleX = W / r.width;
  var scaleY = H / r.height;
  mouse.x = (e.clientX - r.left) * scaleX;
  mouse.y = (e.clientY - r.top) * scaleY;
});
canvas.addEventListener('mousedown', function(e) {
  if (e.button === 0) mouse.down = true;
  if (e.button === 2) { mouse.rightDown = true; e.preventDefault(); }
});
canvas.addEventListener('mouseup', function(e) {
  if (e.button === 0) mouse.down = false;
  if (e.button === 2) mouse.rightDown = false;
});
canvas.addEventListener('contextmenu', function(e) { e.preventDefault(); });
document.addEventListener('keydown', function(e) {
  keys[e.code] = true;
  keys[e.key] = true;
  if (e.code === 'Space') e.preventDefault();
});
document.addEventListener('keyup', function(e) {
  keys[e.code] = false;
  keys[e.key] = false;
});

// =============================================================
// GAME STATE
// =============================================================
var STATE = { MENU: 0, PLAYING: 1, STAGE_CLEAR: 2, GAME_OVER: 3, VICTORY: 4, PAUSED: 5, MAP_SELECT: 6 };
var gameState = STATE.MENU;
var score = 0;
var hiScore = 0;
var stage = 1;
var bossActive = false;
var bossDefeated = false;
var stageClearTimer = 0;
var stageAnnounceTimer = 0;
var bossAnnounceTimer = 0;
var screenShake = 0;
var gameOverTimer = 0;
var pressAnyTimer = 0;

// =============================================================
// PARALLAX STARFIELD
// =============================================================
var stars = [];
// =============================================================
// MAP THEMES (one per stage)
// =============================================================
var MAP_THEMES = {
  1: { name: 'DEEP SPACE',   bg0: '#050010', bg1: '#000005', nebulaHue: [240,300], starColor: '#ffffff', floorColor: 'rgba(0,255,255,0.04)',  accentColor: '#00ffff' },
  2: { name: 'CYBER CITY',   bg0: '#001020', bg1: '#000810', nebulaHue: [180,220], starColor: '#44ffff', floorColor: 'rgba(0,180,255,0.06)',  accentColor: '#00ccff' },
  3: { name: 'LAVA WORLD',   bg0: '#1a0500', bg1: '#0a0200', nebulaHue: [0,40],    starColor: '#ffaa44', floorColor: 'rgba(255,80,0,0.06)',   accentColor: '#ff4400' },
  4: { name: 'NEON FOREST',  bg0: '#001a08', bg1: '#000802', nebulaHue: [100,160], starColor: '#88ff44', floorColor: 'rgba(0,255,80,0.05)',   accentColor: '#00ff44' },
  5: { name: 'VOID RIFT',    bg0: '#0a0020', bg1: '#050015', nebulaHue: [280,340], starColor: '#ff88ff', floorColor: 'rgba(200,0,255,0.06)',  accentColor: '#cc00ff' },
};

function getTheme() { return MAP_THEMES[stage] || MAP_THEMES[1]; }

function initStars() {
  stars = [];
  var i, theme = getTheme();
  for (i = 0; i < 80; i++) stars.push({ x: rand(0, W), y: rand(0, H), r: rand(0.5, 1),   speed: 0.3, layer: 0 });
  for (i = 0; i < 50; i++) stars.push({ x: rand(0, W), y: rand(0, H), r: rand(0.8, 1.5), speed: 0.7, layer: 1 });
  for (i = 0; i < 30; i++) stars.push({ x: rand(0, W), y: rand(0, H), r: rand(1, 2),     speed: 1.4, layer: 2 });
}
initStars();

var nebulae = [];
function initNebulae() {
  nebulae = [];
  var theme = getTheme();
  var lo = theme.nebulaHue[0], hi = theme.nebulaHue[1];
  for (var i = 0; i < 5; i++) {
    nebulae.push({ x: rand(50, W-50), y: rand(50, H-50), r: rand(80,180), hue: randInt(lo, hi), alpha: rand(0.02,0.07) });
  }
}
initNebulae();

function updateStars() {
  for (var i = 0; i < stars.length; i++) {
    stars[i].y += stars[i].speed;
    if (stars[i].y > H) { stars[i].y = 0; stars[i].x = rand(0, W); }
  }
}

function drawBackground() {
  var theme = getTheme();
  var bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, theme.bg0);
  bgGrad.addColorStop(1, theme.bg1);
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Stage-specific ambient effects
  var t = performance.now() * 0.001;
  if (stage === 3) {
    // Lava: glowing cracks at bottom
    var lx;
    for (lx = 0; lx < W; lx += 40) {
      var lg = ctx.createLinearGradient(lx, H - 60, lx + 20, H);
      lg.addColorStop(0, 'rgba(255,80,0,0)');
      lg.addColorStop(1, 'rgba(255,120,0,0.12)');
      ctx.fillStyle = lg;
      ctx.fillRect(lx, H - 60, 20, 60);
    }
  } else if (stage === 4) {
    // Forest: subtle vertical light beams
    for (var bx = 30; bx < W; bx += 70) {
      var beam = ctx.createLinearGradient(bx, 0, bx, H);
      beam.addColorStop(0, 'rgba(0,255,60,0.03)');
      beam.addColorStop(0.5, 'rgba(0,255,60,0.06)');
      beam.addColorStop(1, 'rgba(0,255,60,0.01)');
      ctx.fillStyle = beam;
      ctx.fillRect(bx - 10, 0, 20, H);
    }
  } else if (stage === 5) {
    // Void rift: shifting energy lines
    ctx.strokeStyle = 'rgba(180,0,255,0.08)';
    ctx.lineWidth = 1;
    for (var li = 0; li < 6; li++) {
      var liy = ((t * 30 + li * 120) % (H + 40)) - 20;
      ctx.beginPath(); ctx.moveTo(0, liy); ctx.lineTo(W, liy + 30); ctx.stroke();
    }
  }

  var i, n, grad;
  for (i = 0; i < nebulae.length; i++) {
    n = nebulae[i];
    grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r);
    grad.addColorStop(0, 'hsla(' + n.hue + ',80%,50%,' + (n.alpha * 2) + ')');
    grad.addColorStop(1, 'hsla(' + n.hue + ',80%,30%,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2); ctx.fill();
  }

  var s;
  for (i = 0; i < stars.length; i++) {
    s = stars[i];
    var brightness = s.layer === 2 ? 1 : s.layer === 1 ? 0.8 : 0.5;
    if (s.layer === 2) glow(theme.starColor, 4);
    ctx.fillStyle = s.layer === 2 ? theme.starColor : 'rgba(255,255,255,' + brightness + ')';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    if (s.layer === 2) noGlow();
  }

  var floorGrad = ctx.createLinearGradient(0, H - 80, 0, H);
  floorGrad.addColorStop(0, 'rgba(0,0,0,0)');
  floorGrad.addColorStop(1, theme.floorColor);
  ctx.fillStyle = floorGrad;
  ctx.fillRect(0, H - 80, W, 80);

  // Stage name watermark top-center
  ctx.globalAlpha = 0.07;
  ctx.fillStyle = theme.accentColor;
  ctx.font = 'bold 28px Courier New'; ctx.textAlign = 'center';
  ctx.fillText(theme.name, W / 2, H / 2);
  ctx.globalAlpha = 1;
}

function drawScanlines() {
  ctx.fillStyle = 'rgba(0,0,0,0.03)';
  for (var y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);
}

// =============================================================
// PARTICLES
// =============================================================
var particles = [];

function spawnParticles(x, y, count, color, speedMin, speedMax, lifeMin, lifeMax, sizeMin, sizeMax) {
  for (var i = 0; i < count; i++) {
    var a = rand(0, Math.PI * 2);
    var sp = rand(speedMin, speedMax);
    var life = rand(lifeMin, lifeMax);
    particles.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, color: color, life: life, maxLife: life, size: rand(sizeMin, sizeMax), alpha: 1 });
  }
}

function spawnExplosion(x, y, color, count) {
  spawnParticles(x, y, count, color, 1, 6, 20, 50, 2, 5);
  spawnParticles(x, y, Math.floor(count / 2), '#ffffff', 0.5, 3, 10, 30, 1, 3);
}

function spawnEngineTrail(x, y) {
  if (Math.random() > 0.4) return;
  var life = rand(10, 20);
  particles.push({ x: x + rand(-3, 3), y: y + rand(0, 6), vx: rand(-0.3, 0.3), vy: rand(0.5, 1.5), color: '#00ffff', life: life, maxLife: life, size: rand(1, 3), alpha: 0.8 });
}

function spawnBombRing(x, y) {
  for (var i = 0; i < 60; i++) {
    var a = (i / 60) * Math.PI * 2;
    particles.push({ x: x, y: y, vx: Math.cos(a) * 8, vy: Math.sin(a) * 8, color: '#00ffff', life: 30, maxLife: 30, size: 3, alpha: 1 });
  }
}

function updateParticles() {
  for (var i = particles.length - 1; i >= 0; i--) {
    var p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.05;
    p.life--;
    p.alpha = p.life / p.maxLife;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    ctx.globalAlpha = p.alpha * 0.9;
    glow(p.color, 6);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  noGlow();
  ctx.globalAlpha = 1;
}

// =============================================================
// PLAYER
// =============================================================
var player = {
  x: W / 2, y: H - 150,
  lives: 3,
  weaponLevel: 1,
  bombs: 3,
  invincible: 0,
  fireTimer: 0,
  hitRadius: 6,
  alive: true,
  graze: 0
};

function resetPlayer() {
  player.x = W / 2; player.y = H - 150;
  player.invincible = 0; player.weaponLevel = 1;
  player.alive = true; player.fireTimer = 0; player.graze = 0;
}

function drawPlayerShip(px, py, focusMode) {
  ctx.save();
  ctx.translate(px, py);

  var engineGrad = ctx.createRadialGradient(0, 16, 0, 0, 20, 20);
  engineGrad.addColorStop(0, 'rgba(0,255,255,0.8)');
  engineGrad.addColorStop(1, 'rgba(0,100,255,0)');
  ctx.fillStyle = engineGrad;
  ctx.beginPath();
  ctx.ellipse(0, 18, 10, 16, 0, 0, Math.PI * 2);
  ctx.fill();

  glow('#00ffff', 12);
  ctx.strokeStyle = '#00aaff';
  ctx.lineWidth = 2;
  ctx.fillStyle = 'rgba(0,150,255,0.4)';

  ctx.beginPath();
  ctx.moveTo(0, -18); ctx.lineTo(-24, 8); ctx.lineTo(-16, 14); ctx.lineTo(-8, 6);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(0, -18); ctx.lineTo(24, 8); ctx.lineTo(16, 14); ctx.lineTo(8, 6);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  ctx.fillStyle = 'rgba(0,200,255,0.7)';
  ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, -22); ctx.lineTo(-10, 12); ctx.lineTo(0, 8); ctx.lineTo(10, 12);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  noGlow();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(0, -14); ctx.lineTo(-4, 4); ctx.lineTo(0, 2); ctx.lineTo(4, 4);
  ctx.closePath(); ctx.fill();

  glow('#00ffff', 15);
  ctx.fillStyle = '#00ffff';
  ctx.beginPath(); ctx.arc(0, -22, 2.5, 0, Math.PI * 2); ctx.fill();
  noGlow();

  if (player.graze > 0) {
    ctx.globalAlpha = (player.graze / 20) * 0.6;
    glow('#ffff00', 20);
    ctx.strokeStyle = '#ffff00'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, 28, 0, Math.PI * 2); ctx.stroke();
    noGlow(); ctx.globalAlpha = 1;
  }

  if (focusMode) {
    ctx.globalAlpha = 0.9;
    glow('#ff0066', 8);
    ctx.strokeStyle = '#ff0066'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 0, player.hitRadius, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,0,100,0.3)'; ctx.fill();
    noGlow(); ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function updatePlayer() {
  if (!player.alive) return;
  var focusMode = !!(keys['KeyZ'] || keys['ShiftLeft'] || keys['ShiftRight'] || keys['z'] || keys['Z']);
  var lerpSpeed = focusMode ? 0.055 : 0.11;

  player.x += (mouse.x - player.x) * lerpSpeed * 9;
  player.y += (mouse.y - player.y) * lerpSpeed * 9;
  player.x = clamp(player.x, 20, W - 20);
  player.y = clamp(player.y, 20, H - 20);

  spawnEngineTrail(player.x, player.y + 14);
  if (player.invincible > 0) player.invincible--;
  if (player.graze > 0) player.graze--;

  var firing = !!(mouse.down || keys['Space'] || keys[' ']);
  player.fireTimer++;
  var fireRate = Math.max(4, 8 - player.weaponLevel);
  if (firing && player.fireTimer >= fireRate) {
    player.fireTimer = 0;
    firePlayerBullets();
  }
}

// =============================================================
// PLAYER BULLETS
// =============================================================
var playerBullets = [];

function firePlayerBullets() {
  var wl = player.weaponLevel;
  var x = player.x, y = player.y - 22;
  addPlayerBullet(x, y, 0, -16);
  if (wl >= 2) { addPlayerBullet(x - 8, y, -0.5, -16); addPlayerBullet(x + 8, y, 0.5, -16); }
  if (wl >= 3) { addPlayerBullet(x - 4, y - 5, 0, -16); }
  if (wl >= 4) { addPlayerBullet(x - 14, y + 4, -1.5, -15); addPlayerBullet(x + 14, y + 4, 1.5, -15); }
  if (wl >= 5) { addPlayerBullet(x - 18, y + 8, -2.5, -14); addPlayerBullet(x + 18, y + 8, 2.5, -14); }
}

function addPlayerBullet(x, y, vx, vy) {
  playerBullets.push({ x: x, y: y, vx: vx, vy: vy, r: 4, damage: 1 });
}

function updatePlayerBullets() {
  for (var i = playerBullets.length - 1; i >= 0; i--) {
    var b = playerBullets[i];
    b.x += b.vx; b.y += b.vy;
    if (b.y < -20 || b.x < -20 || b.x > W + 20) playerBullets.splice(i, 1);
  }
}

function drawPlayerBullets() {
  glow('#00ffff', 12);
  for (var i = 0; i < playerBullets.length; i++) {
    var b = playerBullets[i];
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.ellipse(b.x, b.y, 2, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#00ffff';
    ctx.beginPath(); ctx.ellipse(b.x, b.y, 1.5, 4, 0, 0, Math.PI * 2); ctx.fill();
  }
  noGlow();
}

// =============================================================
// ENEMY BULLETS
// =============================================================
var enemyBullets = [];

function addEnemyBullet(x, y, vx, vy, color, r) {
  enemyBullets.push({ x: x, y: y, vx: vx, vy: vy, color: color || '#ff4400', r: r || 5 });
}

function fireAimed(ex, ey, speed, color, spread) {
  var a = angTo(ex, ey, player.x, player.y);
  var s;
  if (spread) {
    for (s = -spread; s <= spread; s++) {
      var a2 = a + s * 0.25;
      addEnemyBullet(ex, ey, Math.cos(a2) * speed, Math.sin(a2) * speed, color);
    }
  } else {
    addEnemyBullet(ex, ey, Math.cos(a) * speed, Math.sin(a) * speed, color);
  }
}

function fireCircle(ex, ey, count, speed, color, offset) {
  for (var i = 0; i < count; i++) {
    var a = (i / count) * Math.PI * 2 + (offset || 0);
    addEnemyBullet(ex, ey, Math.cos(a) * speed, Math.sin(a) * speed, color, 5);
  }
}

function updateEnemyBullets() {
  var i, b, d;
  for (i = enemyBullets.length - 1; i >= 0; i--) {
    b = enemyBullets[i];
    b.x += b.vx; b.y += b.vy;
    if (b.y > H + 30 || b.y < -30 || b.x < -30 || b.x > W + 30) { enemyBullets.splice(i, 1); continue; }
    if (!player.alive || player.invincible > 0) continue;
    d = dist(b.x, b.y, player.x, player.y);
    if (d < player.hitRadius + b.r - 2) {
      killPlayer();
      enemyBullets.splice(i, 1);
    } else if (d < player.hitRadius + b.r + 20) {
      player.graze = 20;
      score += 10 * combo;
      floatingTexts.push({ x: player.x, y: player.y - 30, text: 'GRAZE!', color: '#ffff00', life: 40 });
    }
  }
}

function drawEnemyBullets() {
  var i, b;
  for (i = 0; i < enemyBullets.length; i++) {
    b = enemyBullets[i];
    glow(b.color, 10);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = b.color;
    ctx.globalAlpha = 0.8;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  noGlow();
}

// =============================================================
// COMBO SYSTEM
// =============================================================
var combo = 1;
var comboTimer = 0;

function addKill(points) {
  var earned = points * combo;
  score += earned;
  combo = Math.min(combo + 1, 8);
  comboTimer = 180;
  if (combo > 2) floatingTexts.push({ x: W / 2, y: H / 2 - 50, text: 'x' + combo + ' COMBO!', color: '#ff00ff', life: 60 });
  return earned;
}

function updateCombo() {
  if (comboTimer > 0) { comboTimer--; if (comboTimer === 0) combo = 1; }
}

// =============================================================
// FLOATING TEXTS
// =============================================================
var floatingTexts = [];

function updateFloatingTexts() {
  for (var i = floatingTexts.length - 1; i >= 0; i--) {
    floatingTexts[i].y -= 0.5;
    floatingTexts[i].life--;
    if (floatingTexts[i].life <= 0) floatingTexts.splice(i, 1);
  }
}

function drawFloatingTexts() {
  for (var i = 0; i < floatingTexts.length; i++) {
    var t = floatingTexts[i];
    ctx.globalAlpha = Math.min(1, t.life / 20);
    glow(t.color, 10);
    ctx.fillStyle = t.color;
    ctx.font = 'bold 14px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(t.text, t.x, t.y);
  }
  noGlow(); ctx.globalAlpha = 1;
}

// =============================================================
// POWER-UPS
// =============================================================
var powerups = [];

function spawnPowerup(x, y) {
  if (Math.random() > 0.15) return;
  var r = Math.random();
  var type = r < 0.5 ? 'P' : r < 0.75 ? 'S' : 'B';
  if (Math.random() < 0.05) type = 'L';
  powerups.push({ x: x, y: y, type: type, vy: 1.2, life: 600 });
}

function spawnPowerupForce(x, y, type) {
  powerups.push({ x: x, y: y, type: type, vy: 1.2, life: 600 });
}

function updatePowerups() {
  for (var i = powerups.length - 1; i >= 0; i--) {
    var p = powerups[i];
    p.y += p.vy; p.life--;
    if (p.life <= 0 || p.y > H + 20) { powerups.splice(i, 1); continue; }
    if (player.alive && dist(p.x, p.y, player.x, player.y) < 20) { collectPowerup(p); powerups.splice(i, 1); }
  }
}

function collectPowerup(p) {
  if (p.type === 'P') {
    player.weaponLevel = Math.min(5, player.weaponLevel + 1);
    floatingTexts.push({ x: p.x, y: p.y, text: 'POWER UP!', color: '#00ffff', life: 60 });
  } else if (p.type === 'S') {
    player.invincible = 120;
    floatingTexts.push({ x: p.x, y: p.y, text: 'SHIELD!', color: '#00ff88', life: 60 });
  } else if (p.type === 'B') {
    player.bombs = Math.min(8, player.bombs + 1);
    floatingTexts.push({ x: p.x, y: p.y, text: 'BOMB +1', color: '#ffd700', life: 60 });
  } else if (p.type === 'L') {
    player.lives = Math.min(9, player.lives + 1);
    floatingTexts.push({ x: p.x, y: p.y, text: '1UP !!!', color: '#ff69b4', life: 80 });
  }
  score += 500;
}

var POWERUP_COLORS = { P: '#00ffff', S: '#00ff88', B: '#ffd700', L: '#ff69b4' };

function drawPowerups() {
  for (var i = 0; i < powerups.length; i++) {
    var p = powerups[i];
    var col = POWERUP_COLORS[p.type] || '#fff';
    if (p.life < 120 && Math.floor(p.life / 8) % 2 === 0) continue;
    glow(col, 15);
    ctx.fillStyle = col; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    noGlow();
    ctx.fillStyle = '#000'; ctx.font = 'bold 10px Courier New'; ctx.textAlign = 'center';
    ctx.fillText(p.type === 'L' ? '★' : p.type, p.x, p.y + 4);
  }
}

// =============================================================
// ENEMIES
// =============================================================
var enemies = [];

var ENEMY_DEFS = {
  DRONE:       { shape: 'diamond', color: '#9933ff', hp: 2,  score: 100, speed: 1.8, fireRate: 180, bulletSpeed: 3,   bulletColor: '#ff6600', size: 12 },
  WEAVER:      { shape: 'hex',     color: '#cc44ff', hp: 4,  score: 200, speed: 1.2, fireRate: 120, bulletSpeed: 3.5, bulletColor: '#ff4400', size: 15 },
  BOMBER:      { shape: 'rect',    color: '#990000', hp: 8,  score: 300, speed: 0.6, fireRate: 90,  bulletSpeed: 2.5, bulletColor: '#ff2200', size: 22 },
  INTERCEPTOR: { shape: 'tri',     color: '#ff8800', hp: 3,  score: 250, speed: 3,   fireRate: 100, bulletSpeed: 4,   bulletColor: '#ffaa00', size: 13 },
  TURRET:      { shape: 'oct',     color: '#668866', hp: 15, score: 500, speed: 0,   fireRate: 60,  bulletSpeed: 3,   bulletColor: '#88ff44', size: 18 },
  // New enemy types
  GHOST:       { shape: 'ghost',   color: '#aaffee', hp: 3,  score: 350, speed: 1.4, fireRate: 90,  bulletSpeed: 4,   bulletColor: '#00ffcc', size: 13 },
  SPLITTER:    { shape: 'split',   color: '#ffcc00', hp: 6,  score: 300, speed: 1.0, fireRate: 150, bulletSpeed: 3,   bulletColor: '#ffaa00', size: 17 },
  SHIELDER:    { shape: 'shield',  color: '#4488ff', hp: 5,  score: 400, speed: 0.8, fireRate: 100, bulletSpeed: 3.5, bulletColor: '#88aaff', size: 16 },
};

function spawnEnemy(type, x, y, opts) {
  var def = ENEMY_DEFS[type];
  if (!def) return;
  var e = {
    type: type, x: x, y: y,
    vx: (opts && opts.vx !== undefined) ? opts.vx : 0,
    vy: (opts && opts.vy !== undefined) ? opts.vy : def.speed,
    hp: def.hp, maxHp: def.hp, score: def.score,
    fireTimer: Math.floor(Math.random() * def.fireRate),
    wavePhase: Math.random() * Math.PI * 2, hitFlash: 0,
    shape: def.shape, color: def.color, fireRate: def.fireRate,
    bulletSpeed: def.bulletSpeed, bulletColor: def.bulletColor, size: def.size,
    interceptPhase: null, interceptTimer: 0, fromLeft: false,
    // Ghost fields
    ghostAlpha: type === 'GHOST' ? 0.08 : 1, ghostVisible: false, ghostTimer: 0,
    // Shielder fields
    shieldHp: type === 'SHIELDER' ? 3 : 0, shieldActive: type === 'SHIELDER',
    // Splitter flag
    isMini: (opts && opts.isMini) || false,
  };
  if (type === 'INTERCEPTOR' && opts) {
    e.fromLeft = !!opts.fromLeft;
    e.vx = opts.fromLeft ? def.speed : -def.speed;
    e.vy = 0; e.interceptPhase = 'enter'; e.interceptTimer = 0;
  }
  if (type === 'SPLITTER' && opts && opts.isMini) {
    e.hp = 2; e.maxHp = 2; e.size = 9; e.score = 80;
  }
  enemies.push(e);
}

function updateEnemies() {
  var i, j, e, b;
  for (i = enemies.length - 1; i >= 0; i--) {
    e = enemies[i];
    e.wavePhase += 0.05;
    if (e.hitFlash > 0) e.hitFlash--;

    if (e.type === 'WEAVER') {
      e.x += Math.sin(e.wavePhase * 0.8) * 2; e.y += e.vy;
    } else if (e.type === 'INTERCEPTOR') {
      if (e.interceptPhase === 'enter') {
        e.x += e.vx; e.interceptTimer++;
        if (e.interceptTimer > 60) { e.interceptPhase = 'dive'; e.vx = 0; e.vy = 4; }
      } else { e.y += e.vy; }
    } else if (e.type === 'TURRET') {
      if (e.y < 80) e.y += 0.5;
    } else if (e.type === 'GHOST') {
      e.y += e.vy;
      e.ghostTimer++;
      // Flicker: invisible most of time, visible briefly before firing
      var visWindow = e.fireRate - 30;
      e.ghostVisible = (e.fireTimer >= visWindow);
      e.ghostAlpha = e.ghostVisible ? Math.min(1, (e.fireTimer - visWindow) / 15) : 0.06;
    } else if (e.type === 'SHIELDER') {
      e.x += Math.sin(e.wavePhase * 0.5) * 1.5; e.y += e.vy;
    } else {
      e.x += e.vx; e.y += e.vy;
    }

    if (e.y > H + 60 || e.x < -80 || e.x > W + 80) { enemies.splice(i, 1); continue; }

    e.fireTimer++;
    if (e.fireTimer >= e.fireRate) { e.fireTimer = 0; enemyFire(e); }

    for (j = playerBullets.length - 1; j >= 0; j--) {
      b = playerBullets[j];
      if (dist(b.x, b.y, e.x, e.y) < e.size + 4) {
        if (e.shieldActive) {
          // Shield absorbs the hit
          e.shieldHp -= b.damage;
          e.hitFlash = 6;
          spawnParticles(b.x, b.y, 5, '#88aaff', 1, 3, 8, 16, 1, 2);
          playerBullets.splice(j, 1);
          if (e.shieldHp <= 0) { e.shieldActive = false; spawnParticles(e.x, e.y, 12, '#4488ff', 2, 5, 15, 30, 2, 4); }
        } else {
          e.hp -= b.damage; e.hitFlash = 8;
          playerBullets.splice(j, 1);
          if (e.hp <= 0) { killEnemy(e, i); break; }
        }
      }
    }
  }
}

function enemyFire(e) {
  var spd = e.bulletSpeed * (1 + (stage - 1) * 0.15);
  var s, k, a;
  if (e.type === 'DRONE') { fireAimed(e.x, e.y, spd, e.bulletColor); }
  else if (e.type === 'WEAVER') { fireAimed(e.x, e.y, spd, e.bulletColor, 1); }
  else if (e.type === 'BOMBER') { for (s = -2; s <= 2; s++) addEnemyBullet(e.x + s * 10, e.y, s * 0.8, spd, e.bulletColor, 6); }
  else if (e.type === 'INTERCEPTOR') { fireAimed(e.x, e.y, spd, e.bulletColor); }
  else if (e.type === 'TURRET') { fireCircle(e.x, e.y, 8, spd, e.bulletColor, e.wavePhase); }
  else if (e.type === 'GHOST') {
    // Triple aimed burst
    for (s = -1; s <= 1; s++) {
      a = angTo(e.x, e.y, player.x, player.y) + s * 0.2;
      addEnemyBullet(e.x, e.y, Math.cos(a) * spd, Math.sin(a) * spd, e.bulletColor, 5);
    }
  }
  else if (e.type === 'SPLITTER') { fireAimed(e.x, e.y, spd, e.bulletColor); }
  else if (e.type === 'SHIELDER') {
    // Fires 2-way aimed shot
    for (s = -1; s <= 1; s += 2) {
      a = angTo(e.x, e.y, player.x, player.y) + s * 0.15;
      addEnemyBullet(e.x, e.y, Math.cos(a) * spd, Math.sin(a) * spd, e.bulletColor, 5);
    }
  }
}

function killEnemy(e, idx) {
  addKill(e.score);
  spawnExplosion(e.x, e.y, e.color, 20);
  spawnPowerup(e.x, e.y);
  // SPLITTER: spawn 2 mini versions
  if (e.type === 'SPLITTER' && !e.isMini) {
    spawnEnemy('SPLITTER', e.x - 14, e.y, { isMini: true, vx: -1.2, vy: 1.2 });
    spawnEnemy('SPLITTER', e.x + 14, e.y, { isMini: true, vx:  1.2, vy: 1.2 });
  }
  enemies.splice(idx, 1);
}

function drawEnemies() {
  var i, e, k, a, r;
  for (i = 0; i < enemies.length; i++) {
    e = enemies[i];
    ctx.save();
    ctx.translate(e.x, e.y);

    // Ghost: draw with variable alpha
    if (e.type === 'GHOST') ctx.globalAlpha = e.ghostAlpha;

    if (e.hitFlash > 0 && Math.floor(e.hitFlash / 2) % 2 === 0) {
      ctx.fillStyle = '#ffffff'; glow('#fff', 20);
    } else {
      ctx.fillStyle = e.color; glow(e.color, 12);
    }
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5;

    if (e.shape === 'diamond') {
      ctx.beginPath();
      ctx.moveTo(0, -e.size); ctx.lineTo(e.size * 0.7, 0);
      ctx.lineTo(0, e.size); ctx.lineTo(-e.size * 0.7, 0);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    } else if (e.shape === 'hex') {
      ctx.beginPath();
      for (k = 0; k < 6; k++) {
        a = (k / 6) * Math.PI * 2 - Math.PI / 6;
        if (k === 0) ctx.moveTo(Math.cos(a) * e.size, Math.sin(a) * e.size);
        else ctx.lineTo(Math.cos(a) * e.size, Math.sin(a) * e.size);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
    } else if (e.shape === 'rect') {
      ctx.fillRect(-e.size, -e.size * 0.5, e.size * 2, e.size);
      ctx.strokeRect(-e.size, -e.size * 0.5, e.size * 2, e.size);
    } else if (e.shape === 'tri') {
      ctx.beginPath();
      ctx.moveTo(0, -e.size); ctx.lineTo(e.size, e.size); ctx.lineTo(-e.size, e.size);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    } else if (e.shape === 'oct') {
      ctx.beginPath();
      for (k = 0; k < 8; k++) {
        a = (k / 8) * Math.PI * 2 + e.wavePhase;
        if (k === 0) ctx.moveTo(Math.cos(a) * e.size, Math.sin(a) * e.size);
        else ctx.lineTo(Math.cos(a) * e.size, Math.sin(a) * e.size);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }

    // New shapes
    if (e.shape === 'ghost') {
      // Wispy circle with inner cross
      ctx.beginPath(); ctx.arc(0, 0, e.size, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.globalAlpha *= 0.6;
      ctx.beginPath(); ctx.moveTo(0, -e.size * 0.6); ctx.lineTo(0, e.size * 0.6);
      ctx.moveTo(-e.size * 0.6, 0); ctx.lineTo(e.size * 0.6, 0); ctx.stroke();
    } else if (e.shape === 'split') {
      // Star/burst shape
      for (k = 0; k < 6; k++) {
        a = (k / 6) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a) * e.size, Math.sin(a) * e.size);
        ctx.lineTo(Math.cos(a + 0.3) * e.size * 0.5, Math.sin(a + 0.3) * e.size * 0.5);
        ctx.closePath(); ctx.fill(); ctx.stroke();
      }
    } else if (e.shape === 'shield') {
      // Pentagon body
      ctx.beginPath();
      for (k = 0; k < 5; k++) {
        a = (k / 5) * Math.PI * 2 - Math.PI / 2;
        if (k === 0) ctx.moveTo(Math.cos(a) * e.size, Math.sin(a) * e.size);
        else ctx.lineTo(Math.cos(a) * e.size, Math.sin(a) * e.size);
      }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      // Draw shield ring if active
      if (e.shieldActive) {
        noGlow(); glow('#aaccff', 20);
        ctx.strokeStyle = '#aaddff'; ctx.lineWidth = 3; ctx.globalAlpha = 0.9;
        ctx.beginPath(); ctx.arc(0, 0, e.size + 8, 0, Math.PI * 2); ctx.stroke();
      }
    }

    if (e.hp < e.maxHp) {
      noGlow();
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#333'; ctx.fillRect(-e.size, e.size + 3, e.size * 2, 3);
      ctx.fillStyle = '#ff3300'; ctx.fillRect(-e.size, e.size + 3, e.size * 2 * (e.hp / e.maxHp), 3);
    }
    ctx.globalAlpha = 1;
    noGlow(); ctx.restore();
  }
}

// =============================================================
// BOSS
// =============================================================
var boss = null;
var bossCircleOffset = 0;

function spawnBoss() {
  bossActive = true; bossAnnounceTimer = 180;
  boss = {
    x: W / 2, y: -80, targetY: 120,
    hp: stage === 1 ? 150 : 300 * stage, maxHp: stage === 1 ? 150 : 300 * stage,
    phase: 1, fireTimer: 0, fireTimer2: 0, fireTimer3: 0,
    wavePhase: 0, hitFlash: 0, movePhase: 0, vx: 1,
    alive: true, size: 44, entering: true
  };
}

function updateBoss() {
  if (!boss || !boss.alive) return;
  boss.wavePhase += 0.02; boss.movePhase += 0.008; bossCircleOffset += 0.04;
  if (boss.hitFlash > 0) boss.hitFlash--;

  if (boss.entering) {
    boss.y = lerp(boss.y, boss.targetY, 0.03);
    if (Math.abs(boss.y - boss.targetY) < 2) boss.entering = false;
  } else {
    boss.x += boss.vx * 1.2;
    boss.y = boss.targetY + Math.sin(boss.movePhase) * 30;
    if (boss.x > W - 60 || boss.x < 60) boss.vx *= -1;
  }

  var hpRatio = boss.hp / boss.maxHp;
  if (hpRatio <= 0.25 && boss.phase < 3) boss.phase = 3;
  else if (hpRatio <= 0.5 && boss.phase < 2) boss.phase = 2;

  if (!boss.entering) {
    boss.fireTimer++;
    var rate1 = stage === 1 ? 90 : Math.max(25, 60 - stage * 5);
    if (boss.fireTimer >= rate1) {
      boss.fireTimer = 0;
      fireAimed(boss.x, boss.y, stage === 1 ? 2.5 : 3.5 + stage * 0.3, '#ff6600', 1);
      var s;
      var spread = stage === 1 ? 2 : 3;
      for (s = -spread; s <= spread; s++) addEnemyBullet(boss.x, boss.y, s * 1.0, stage === 1 ? 2 : 3, '#ff3300', 6);
    }
    if (boss.phase >= 2) {
      boss.fireTimer2++;
      if (boss.fireTimer2 >= 80) { boss.fireTimer2 = 0; fireCircle(boss.x, boss.y, 16, 3.5, '#ff00aa', bossCircleOffset); }
    }
    if (boss.phase >= 3) {
      boss.fireTimer3++;
      if (boss.fireTimer3 >= 30) {
        boss.fireTimer3 = 0;
        var k;
        for (k = 0; k < 8; k++) {
          var a = boss.wavePhase + (k / 8) * Math.PI * 2;
          addEnemyBullet(boss.x, boss.y, Math.cos(a) * 4, Math.sin(a) * 4, '#ff0000', 5);
        }
        fireAimed(boss.x, boss.y, 5, '#ffaa00');
      }
    }
  }

  var j, b;
  for (j = playerBullets.length - 1; j >= 0; j--) {
    b = playerBullets[j];
    if (dist(b.x, b.y, boss.x, boss.y) < boss.size + 6) {
      boss.hp -= b.damage; boss.hitFlash = 6;
      screenShake = Math.max(screenShake, 4);
      playerBullets.splice(j, 1);
      if (boss.hp <= 0) { killBoss(); return; }
    }
  }
}

function killBoss() {
  var bx = boss.x, by = boss.y;
  var idx;
  for (idx = 0; idx < 12; idx++) {
    (function(n) {
      setTimeout(function() {
        spawnExplosion(bx + rand(-60, 60), by + rand(-60, 60), '#ffd700', 30);
        screenShake = 10;
      }, n * 100);
    })(idx);
  }
  score += 5000 * stage;
  spawnPowerupForce(bx - 30, by, 'P');
  spawnPowerupForce(bx, by, 'B');
  spawnPowerupForce(bx + 30, by, 'S');
  if (Math.random() < 0.4) spawnPowerupForce(bx, by + 20, 'L');
  boss.alive = false; bossDefeated = true; bossActive = false;
  setTimeout(function() {
    if (score > hiScore) hiScore = score;
    if (stage >= 5) { gameState = STATE.VICTORY; }
    else { gameState = STATE.STAGE_CLEAR; stageClearTimer = 0; }
  }, 1500);
}

function drawBoss() {
  if (!boss || !boss.alive) return;
  ctx.save();
  ctx.translate(boss.x, boss.y);
  var flash = boss.hitFlash > 0 && Math.floor(boss.hitFlash / 2) % 2 === 0;
  glow(flash ? '#ffffff' : '#ffd700', 20);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
  ctx.fillStyle = flash ? '#ffffff' : 'rgba(180,120,0,0.85)';

  var k, a, r;
  ctx.beginPath();
  for (k = 0; k < 8; k++) {
    a = (k / 8) * Math.PI * 2 + boss.wavePhase * 0.5;
    r = boss.size * (k % 2 === 0 ? 1 : 0.75);
    if (k === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();

  if (!flash) {
    var phaseCol = boss.phase === 3 ? '#ff0000' : boss.phase === 2 ? '#ff6600' : '#ffdd00';
    glow(phaseCol, 30); ctx.fillStyle = phaseCol;
    ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fill();
  }

  noGlow(); glow('#ffd700', 8);
  ctx.strokeStyle = 'rgba(255,215,0,0.5)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(0, 0, boss.size + 12, 0, Math.PI * 2); ctx.stroke();
  for (k = 0; k < 8; k++) {
    a = bossCircleOffset + (k / 8) * Math.PI * 2;
    ctx.fillStyle = '#ffd700';
    ctx.beginPath(); ctx.arc(Math.cos(a) * (boss.size + 12), Math.sin(a) * (boss.size + 12), 3, 0, Math.PI * 2); ctx.fill();
  }
  noGlow(); ctx.restore();
}

// =============================================================
// WAVE / STAGE SPAWNING
// =============================================================
var spawnQueue = [];
var spawnTimer = 0;
var wavesDone = false;

function buildStageWaves(stg) {
  spawnQueue = []; wavesDone = false; bossDefeated = false;
  var t = 120;

  function pushFormation(spawns, duration) {
    var s;
    for (s = 0; s < spawns.length; s++) {
      spawnQueue.push({ time: t + spawns[s].delay, type: spawns[s].type, x: spawns[s].x, y: spawns[s].y, opts: spawns[s].opts || null });
    }
    t += duration;
  }

  function vFormation(type, cx, cy, count, spacing, startDelay) {
    var spawns = [], i;
    for (i = 0; i < count; i++) spawns.push({ type: type, x: cx + (i - Math.floor(count / 2)) * spacing, y: cy - Math.abs(i - Math.floor(count / 2)) * 25, delay: startDelay + i * 15 });
    return spawns;
  }
  function lineFormation(type, count, startDelay) {
    var spawns = [], i, spacing = (W - 80) / Math.max(1, count - 1);
    for (i = 0; i < count; i++) spawns.push({ type: type, x: 40 + i * spacing, y: -30, delay: startDelay + i * 20 });
    return spawns;
  }
  function diamondFormation(type, cx, cy, count) {
    var pos = [[0,0],[-1,1],[1,1],[-2,2],[0,2],[2,2],[-1,3],[1,3]], spawns = [], i;
    for (i = 0; i < Math.min(count, pos.length); i++) spawns.push({ type: type, x: cx + pos[i][0] * 35, y: cy - pos[i][1] * 25, delay: i * 25 });
    return spawns;
  }
  function scatterFormation(type, count) {
    var spawns = [], i;
    for (i = 0; i < count; i++) spawns.push({ type: type, x: rand(60, W - 60), y: rand(-60, -20), delay: i * 40 });
    return spawns;
  }
  function interceptorWave(count) {
    var spawns = [], i, fromLeft;
    for (i = 0; i < count; i++) {
      fromLeft = i % 2 === 0;
      spawns.push({ type: 'INTERCEPTOR', x: fromLeft ? -20 : W + 20, y: rand(60, 200), delay: i * 30, opts: { fromLeft: fromLeft, vx: fromLeft ? 3 : -3, vy: 0 } });
    }
    return spawns;
  }

  // Stage 1 — DEEP SPACE: Drones only
  pushFormation(vFormation('DRONE', W/2, -20, 5, 40, 0), 300);
  pushFormation(lineFormation('DRONE', 6, 0), 250);
  pushFormation(vFormation('DRONE', W/4, -20, 4, 35, 0), 280);
  pushFormation(vFormation('DRONE', W*3/4, -20, 4, 35, 0), 280);
  pushFormation(diamondFormation('DRONE', W/2, -20, 6), 300);

  if (stg >= 2) {
    // Stage 2 — CYBER CITY: + Weavers, Bombers, Ghosts appear
    pushFormation(lineFormation('WEAVER', 4, 0), 300);
    pushFormation(scatterFormation('GHOST', 3), 280);
    pushFormation(vFormation('WEAVER', W/2, -20, 5, 45, 0), 350);
    pushFormation(scatterFormation('BOMBER', 3), 250);
    pushFormation(lineFormation('DRONE', 5, 0), 300);
    pushFormation([{ type:'GHOST', x:W*0.25, y:-30, delay:0 }, { type:'GHOST', x:W*0.5, y:-30, delay:40 }, { type:'GHOST', x:W*0.75, y:-30, delay:80 }], 280);
    pushFormation(diamondFormation('WEAVER', W/2, -30, 5), 300);
  }
  if (stg >= 3) {
    // Stage 3 — LAVA WORLD: + Interceptors, Turrets, Splitters
    pushFormation(interceptorWave(4), 200);
    pushFormation(scatterFormation('SPLITTER', 3), 300);
    pushFormation([{ type:'TURRET', x:W/4, y:-30, delay:0 }, { type:'TURRET', x:W*3/4, y:-30, delay:60 }], 300);
    pushFormation(vFormation('BOMBER', W/2, -20, 4, 50, 0), 350);
    pushFormation(interceptorWave(6), 250);
    pushFormation(lineFormation('SPLITTER', 4, 0), 320);
    pushFormation(lineFormation('WEAVER', 5, 0), 300);
  }
  if (stg >= 4) {
    // Stage 4 — NEON FOREST: + Shielders, mix of all
    pushFormation(scatterFormation('DRONE', 6), 300);
    pushFormation(lineFormation('SHIELDER', 4, 0), 320);
    pushFormation(interceptorWave(8), 250);
    pushFormation(scatterFormation('GHOST', 4), 280);
    pushFormation(lineFormation('BOMBER', 4, 0), 300);
    pushFormation([{ type:'SHIELDER', x:W*0.2, y:-30, delay:0 }, { type:'SHIELDER', x:W*0.5, y:-30, delay:50 }, { type:'SHIELDER', x:W*0.8, y:-30, delay:100 }], 350);
    pushFormation([{ type:'TURRET', x:W/2, y:-30, delay:0 }, { type:'TURRET', x:W/4, y:-30, delay:50 }, { type:'TURRET', x:W*3/4, y:-30, delay:100 }], 350);
    pushFormation(vFormation('WEAVER', W/2, -20, 7, 35, 0), 300);
  }
  if (stg >= 5) {
    // Stage 5 — VOID RIFT: all types, maximum chaos
    pushFormation(scatterFormation('DRONE', 8), 200);
    pushFormation(lineFormation('GHOST', 5, 0), 280);
    pushFormation(interceptorWave(10), 250);
    pushFormation(scatterFormation('SPLITTER', 5), 280);
    pushFormation(diamondFormation('BOMBER', W/2, -30, 7), 300);
    pushFormation(lineFormation('SHIELDER', 5, 0), 320);
    pushFormation(scatterFormation('WEAVER', 6), 200);
    pushFormation([{ type:'TURRET', x:W*0.2, y:-30, delay:0 }, { type:'TURRET', x:W*0.5, y:-30, delay:40 }, { type:'TURRET', x:W*0.8, y:-30, delay:80 }], 300);
    pushFormation(lineFormation('DRONE', 8, 0), 300);
  }

  spawnQueue.push({ time: t, endMarker: true });
}

function processSpawnQueue() {
  spawnTimer++;
  var i, s;
  for (i = spawnQueue.length - 1; i >= 0; i--) {
    s = spawnQueue[i];
    if (spawnTimer >= s.time) {
      if (s.endMarker) { wavesDone = true; }
      else { spawnEnemy(s.type, s.x, s.y, s.opts); }
      spawnQueue.splice(i, 1);
    }
  }
  if (wavesDone && !bossActive && !bossDefeated && enemies.length === 0) spawnBoss();
}

// =============================================================
// LASER ATTACK (X key)
// =============================================================
var laserActive = false;
var laserTimer = 0;
var laserDuration = 50;   // frames the beam stays on
var laserCooldown = 0;
var laserMaxCooldown = 240; // 4 seconds at 60fps

function useLaser() {
  if (laserActive || laserCooldown > 0) return;
  laserActive = true;
  laserTimer = laserDuration;
  laserCooldown = laserMaxCooldown;
  screenShake = 4;
}

function updateLaser() {
  if (!laserActive) return;
  laserTimer--;

  var lx = player.x;
  // Damage enemies
  var i;
  for (i = enemies.length - 1; i >= 0; i--) {
    var e = enemies[i];
    if (Math.abs(e.x - lx) < 18) {
      e.hp -= 4; e.hitFlash = 6;
      if (e.hp <= 0) killEnemy(e, i);
    }
  }
  // Damage boss
  if (boss && boss.alive && Math.abs(boss.x - lx) < boss.size + 10) {
    boss.hp -= 3; boss.hitFlash = 4;
    if (boss.hp <= 0) killBoss();
  }
  // Destroy enemy bullets in beam path
  for (i = enemyBullets.length - 1; i >= 0; i--) {
    if (Math.abs(enemyBullets[i].x - lx) < 14) {
      spawnParticles(enemyBullets[i].x, enemyBullets[i].y, 3, '#ff0044', 1, 3, 8, 16, 1, 2);
      enemyBullets.splice(i, 1);
    }
  }

  if (laserTimer <= 0) laserActive = false;
}

function drawLaser() {
  if (!laserActive) return;
  var progress = laserTimer / laserDuration;
  var lx = player.x;
  var alpha = Math.min(1, progress * 3);

  ctx.save();
  // Outer glow beam
  glow('#ff00ff', 40);
  ctx.globalAlpha = alpha * 0.5;
  ctx.strokeStyle = '#ff00ff';
  ctx.lineWidth = 18;
  ctx.beginPath(); ctx.moveTo(lx, player.y); ctx.lineTo(lx, 0); ctx.stroke();

  // Mid beam
  glow('#ff88ff', 20);
  ctx.globalAlpha = alpha * 0.8;
  ctx.strokeStyle = '#ff44ff';
  ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(lx, player.y); ctx.lineTo(lx, 0); ctx.stroke();

  // Core white beam
  noGlow();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(lx, player.y); ctx.lineTo(lx, 0); ctx.stroke();

  // Sparks at player origin
  ctx.globalAlpha = alpha;
  glow('#ff00ff', 20);
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(lx, player.y, 6, 0, Math.PI * 2); ctx.fill();

  ctx.globalAlpha = 1;
  noGlow();
  ctx.restore();
}

// =============================================================
// PLASMA NOVA ATTACK (C key)
// =============================================================
var novaOrbs = [];
var novaCooldown = 0;
var novaMaxCooldown = 360; // 6 seconds

function useNova() {
  if (novaCooldown > 0) return;
  novaCooldown = novaMaxCooldown;
  screenShake = 6;
  spawnParticles(player.x, player.y, 20, '#ff44ff', 2, 6, 20, 40, 2, 4);
  // Fire 8 plasma orbs in all directions
  for (var i = 0; i < 8; i++) {
    var a = (i / 8) * Math.PI * 2;
    novaOrbs.push({
      x: player.x, y: player.y,
      vx: Math.cos(a) * 4, vy: Math.sin(a) * 4,
      life: 120, maxLife: 120,
      angle: a, homing: false, homingTimer: 15,
      trail: [],
    });
  }
}

function updateNova() {
  if (novaCooldown > 0) novaCooldown--;
  var i, j, e, orb, best, bestDist, d;
  for (i = novaOrbs.length - 1; i >= 0; i--) {
    orb = novaOrbs[i];
    orb.life--;
    if (orb.life <= 0) { novaOrbs.splice(i, 1); continue; }

    // Trail
    orb.trail.push({ x: orb.x, y: orb.y });
    if (orb.trail.length > 10) orb.trail.shift();

    // Homing: after brief delay, find nearest enemy
    if (orb.homingTimer > 0) { orb.homingTimer--; }
    else {
      best = null; bestDist = 9999;
      for (j = 0; j < enemies.length; j++) {
        d = dist(orb.x, orb.y, enemies[j].x, enemies[j].y);
        if (d < bestDist) { bestDist = d; best = enemies[j]; }
      }
      if (!best && boss && boss.alive) best = boss;
      if (best) {
        var ta = angTo(orb.x, orb.y, best.x, best.y);
        var curA = Math.atan2(orb.vy, orb.vx);
        var diff = ta - curA;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        curA += diff * 0.12;
        var spd = Math.hypot(orb.vx, orb.vy);
        spd = Math.min(spd + 0.15, 7);
        orb.vx = Math.cos(curA) * spd;
        orb.vy = Math.sin(curA) * spd;
      }
    }

    orb.x += orb.vx;
    orb.y += orb.vy;

    // Off screen
    if (orb.x < -30 || orb.x > W + 30 || orb.y < -30 || orb.y > H + 30) {
      novaOrbs.splice(i, 1); continue;
    }

    // Hit enemies
    var hit = false;
    for (j = enemies.length - 1; j >= 0; j--) {
      e = enemies[j];
      if (dist(orb.x, orb.y, e.x, e.y) < e.size + 8) {
        if (e.shieldActive) {
          e.shieldHp -= 2;
          if (e.shieldHp <= 0) { e.shieldActive = false; spawnParticles(e.x, e.y, 10, '#4488ff', 2, 4, 12, 24, 2, 3); }
        } else {
          e.hp -= 3; e.hitFlash = 8;
          if (e.hp <= 0) killEnemy(e, j);
        }
        spawnParticles(orb.x, orb.y, 8, '#ff44ff', 1, 4, 10, 20, 1, 3);
        novaOrbs.splice(i, 1); hit = true; break;
      }
    }
    if (hit) continue;
    // Hit boss
    if (boss && boss.alive && dist(orb.x, orb.y, boss.x, boss.y) < boss.size + 8) {
      boss.hp -= 8; boss.hitFlash = 8;
      if (boss.hp <= 0) killBoss();
      spawnParticles(orb.x, orb.y, 12, '#ff44ff', 2, 5, 15, 30, 2, 4);
      novaOrbs.splice(i, 1);
    }
  }
}

function drawNova() {
  var i, t, orb, alpha, r, p;
  for (i = 0; i < novaOrbs.length; i++) {
    orb = novaOrbs[i];
    alpha = orb.life / orb.maxLife;
    r = 7 + Math.sin(orb.life * 0.4) * 2;

    // Trail
    for (t = 0; t < orb.trail.length; t++) {
      p = orb.trail[t];
      var ta = (t / orb.trail.length) * alpha * 0.5;
      ctx.globalAlpha = ta;
      ctx.fillStyle = '#ff00ff';
      ctx.beginPath(); ctx.arc(p.x, p.y, r * (t / orb.trail.length) * 0.7, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Orb body
    glow('#ff00ff', 20);
    var grad = ctx.createRadialGradient(orb.x, orb.y, 0, orb.x, orb.y, r);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.4, '#ff88ff');
    grad.addColorStop(1, 'rgba(180,0,255,0)');
    ctx.fillStyle = grad;
    ctx.globalAlpha = alpha;
    ctx.beginPath(); ctx.arc(orb.x, orb.y, r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    noGlow();
  }
}

function useBomb() {
  if (player.bombs <= 0 || bombActive || bombCooldown > 0) return;
  player.bombs--;
  bombActive = true; bombTimer = 60; bombRadius = 0;
  spawnBombRing(player.x, player.y);
  screenShake = 8; player.invincible = 120;
}

function updateBomb() {
  if (!bombActive) return;
  bombTimer--;
  bombRadius = (1 - bombTimer / 60) * Math.max(W, H) * 1.5;
  var i;
  for (i = enemies.length - 1; i >= 0; i--) {
    enemies[i].hp -= 5; enemies[i].hitFlash = 8;
    if (enemies[i].hp <= 0) killEnemy(enemies[i], i);
  }
  if (boss && boss.alive) {
    boss.hp -= 15; boss.hitFlash = 8;
    if (boss.hp <= 0) killBoss();
  }
  enemyBullets = [];
  if (bombTimer <= 0) { bombActive = false; bombCooldown = 30; }
}

function drawBomb() {
  if (!bombActive) return;
  ctx.globalAlpha = (bombTimer / 60) * 0.4;
  glow('#00ffff', 30);
  ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(player.x, player.y, bombRadius, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = 'rgba(0,255,255,0.15)'; ctx.fillRect(0, 0, W, H);
  noGlow(); ctx.globalAlpha = 1;
}

function killPlayer() {
  if (!player.alive || player.invincible > 0) return;
  player.alive = false; combo = 1; comboTimer = 0;
  spawnExplosion(player.x, player.y, '#ff6600', 40);
  spawnExplosion(player.x, player.y, '#ffffff', 20);
  screenShake = 15; player.lives--;
  if (player.lives <= 0) {
    setTimeout(function() {
      if (score > hiScore) hiScore = score;
      gameState = STATE.GAME_OVER; gameOverTimer = 0;
    }, 1500);
  } else {
    setTimeout(function() { resetPlayer(); player.invincible = 180; }, 1500);
  }
}

var mapSelectHover = -1;

var MAP_DESCS = {
  1: { emoji: '🌌', diff: 'EASY',     diffColor: '#44ff88', desc: 'Drones only. Learn the basics.' },
  2: { emoji: '🏙️', diff: 'MEDIUM',   diffColor: '#ffff44', desc: 'Ghosts & Bombers join the fight.' },
  3: { emoji: '🌋', diff: 'HARD',     diffColor: '#ff8844', desc: 'Splitters erupt from the lava.' },
  4: { emoji: '🌿', diff: 'VERY HARD',diffColor: '#ff4444', desc: 'Shielders guard the neon forest.' },
  5: { emoji: '🕳️', diff: 'EXTREME',  diffColor: '#ff00ff', desc: 'All enemies. Maximum chaos.' },
};

function drawMapSelect() {
  ctx.fillStyle = '#000010'; ctx.fillRect(0, 0, W, H);

  glow('#00ffff', 20);
  ctx.fillStyle = '#00ffff'; ctx.font = 'bold 22px Courier New'; ctx.textAlign = 'center';
  ctx.fillText('SELECT MAP', W/2, 48);
  noGlow();
  ctx.fillStyle = '#446688'; ctx.font = '11px Courier New';
  ctx.fillText('Click a map to start · ESC = back', W/2, 66);

  var cardW = 200, cardH = 122, cols = 2;
  var startX = W/2 - cardW - 10;
  var startY = 85;
  var pad = 10;

  mapSelectHover = -1;
  var mx2 = mouse.x, my2 = mouse.y;

  var i, stg, m, def, cx, cy, isHover, borderCol, theme;
  for (i = 0; i < 5; i++) {
    stg = i + 1;
    m = MAP_DESCS[stg];
    def = MAP_THEMES[stg];

    // 2 columns: i<2 → row0, i==2 → center row1, i>=3 → row1
    var col, row;
    if (i < 2)      { col = i;     row = 0; }
    else if (i == 2){ col = 0.5;   row = 1; }
    else             { col = i - 2; row = 2; }

    cx = startX + col * (cardW + pad);
    cy = startY + row * (cardH + pad);

    isHover = mx2 >= cx && mx2 <= cx + cardW && my2 >= cy && my2 <= cy + cardH;
    if (isHover) mapSelectHover = stg;

    // Card background
    ctx.fillStyle = isHover ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.03)';
    ctx.strokeStyle = isHover ? def.accentColor : 'rgba(255,255,255,0.15)';
    ctx.lineWidth = isHover ? 2 : 1;
    ctx.fillRect(cx, cy, cardW, cardH);
    ctx.strokeRect(cx, cy, cardW, cardH);

    // Accent top bar
    ctx.fillStyle = def.accentColor;
    ctx.globalAlpha = isHover ? 0.5 : 0.25;
    ctx.fillRect(cx, cy, cardW, 3);
    ctx.globalAlpha = 1;

    // Emoji
    ctx.font = '28px serif'; ctx.textAlign = 'center';
    ctx.fillText(m.emoji, cx + cardW/2, cy + 38);

    // Stage + name
    glow(def.accentColor, isHover ? 12 : 6);
    ctx.fillStyle = def.accentColor; ctx.font = 'bold 10px Courier New';
    ctx.fillText('STAGE ' + stg, cx + cardW/2, cy + 56);
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 13px Courier New';
    ctx.fillText(def.name, cx + cardW/2, cy + 72);
    noGlow();

    // Difficulty badge
    ctx.fillStyle = m.diffColor; ctx.font = 'bold 9px Courier New';
    ctx.fillText(m.diff, cx + cardW/2, cy + 88);

    // Description
    ctx.fillStyle = '#888888'; ctx.font = '9px Courier New';
    ctx.fillText(m.desc, cx + cardW/2, cy + 105);

    // Hover glow border
    if (isHover) {
      glow(def.accentColor, 20);
      ctx.strokeStyle = def.accentColor; ctx.lineWidth = 2;
      ctx.strokeRect(cx, cy, cardW, cardH);
      noGlow();
    }
  }

  // Back hint
  ctx.fillStyle = '#334455'; ctx.font = '11px Courier New'; ctx.textAlign = 'center';
  ctx.fillText('[ ESC ] back to menu', W/2, H - 15);
}

function drawPauseScreen() {
  ctx.fillStyle = 'rgba(0,0,20,0.75)'; ctx.fillRect(0,0,W,H);
  glow('#00ffff', 20); ctx.fillStyle = '#00ffff'; ctx.font = 'bold 42px Courier New'; ctx.textAlign = 'center';
  ctx.fillText('PAUSED', W/2, H/2-20); noGlow();
  ctx.fillStyle = '#aaaaaa'; ctx.font = '14px Courier New';
  ctx.fillText('ESC / SPACE / CLICK to resume', W/2, H/2+20);
}

function drawStageClear() {
  ctx.fillStyle = 'rgba(0,0,20,0.7)'; ctx.fillRect(0,0,W,H);
  glow('#00ff88', 20); ctx.fillStyle = '#00ff88'; ctx.font = 'bold 36px Courier New'; ctx.textAlign = 'center';
  ctx.fillText('STAGE ' + stage, W/2, H/2-60);
  ctx.fillText('CLEAR!', W/2, H/2-15); noGlow();
  glow('#ffd700', 10); ctx.fillStyle = '#ffd700'; ctx.font = 'bold 18px Courier New';
  ctx.fillText('SCORE  ' + padScore(score), W/2, H/2+30); noGlow();
  if (stageClearTimer > 120 && Math.floor(pressAnyTimer/30) % 2 === 0) {
    ctx.fillStyle = '#fff'; ctx.font = '13px Courier New';
    ctx.fillText('CLICK OR SPACE TO CONTINUE', W/2, H/2+70);
  }
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(20,0,0,0.8)'; ctx.fillRect(0,0,W,H);
  glow('#ff0000', 25); ctx.fillStyle = '#ff4400'; ctx.font = 'bold 48px Courier New'; ctx.textAlign = 'center';
  ctx.fillText('GAME OVER', W/2, H/2-60); noGlow();
  glow('#ffd700', 10); ctx.fillStyle = '#ffd700'; ctx.font = 'bold 18px Courier New';
  ctx.fillText('SCORE  ' + padScore(score), W/2, H/2-10);
  ctx.fillText('HI     ' + padScore(hiScore), W/2, H/2+20); noGlow();
  ctx.fillStyle = '#888'; ctx.font = '12px Courier New';
  ctx.fillText('Reached Stage ' + stage, W/2, H/2+55);
  if (gameOverTimer > 120 && Math.floor(pressAnyTimer/30) % 2 === 0) {
    ctx.fillStyle = '#fff'; ctx.font = '13px Courier New';
    ctx.fillText('CLICK OR SPACE TO RETRY', W/2, H/2+90);
  }
}

function drawVictory() {
  var grad = ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0, 'rgba(0,0,40,0.9)'); grad.addColorStop(1, 'rgba(40,0,40,0.9)');
  ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
  glow('#ffd700', 30); ctx.fillStyle = '#ffd700'; ctx.font = 'bold 42px Courier New'; ctx.textAlign = 'center';
  ctx.fillText('VICTORY!', W/2, H/2-80); noGlow();
  glow('#ff00ff', 15); ctx.fillStyle = '#ff88ff'; ctx.font = 'bold 20px Courier New';
  ctx.fillText('ALL STAGES CLEARED!', W/2, H/2-30); noGlow();
  glow('#ffd700', 10); ctx.fillStyle = '#ffd700'; ctx.font = 'bold 18px Courier New';
  ctx.fillText('FINAL SCORE', W/2, H/2+20);
  ctx.fillText(padScore(score), W/2, H/2+48); noGlow();
  if (Math.floor(pressAnyTimer/30) % 2 === 0) {
    ctx.fillStyle = '#fff'; ctx.font = '13px Courier New';
    ctx.fillText('CLICK OR SPACE TO RETURN', W/2, H/2+90);
  }
  if (Math.random() < 0.3) {
    spawnExplosion(rand(50, W-50), rand(50, H*0.6), 'hsl(' + randInt(0,360) + ',100%,60%)', 8);
  }
}

// =============================================================
// MAIN GAME LOOP
// =============================================================
function gameLoop() {
  requestAnimationFrame(gameLoop);
  pressAnyTimer++;

  ctx.save();

  if (gameState === STATE.MENU) {
    updateStars();
    drawBackground(); drawScanlines(); drawMenu();
    ctx.restore();
    if (mouse.down || keys['Space'] || keys[' ']) { mouse.down = false; startNewGame(); }
    return;
  }

  if (gameState === STATE.MAP_SELECT) {
    updateStars();
    drawBackground(); drawScanlines(); drawMapSelect();
    ctx.restore();
    if (mouse.down && mapSelectHover >= 1) {
      startFromMap(mapSelectHover);
    }
    if (keys['Escape']) { keys['Escape'] = false; gameState = STATE.MENU; mouse.down = false; }
    return;
  }

  if (gameState === STATE.PLAYING) {
    updateStars(); updateParticles(); updateCombo();
    updateFloatingTexts(); updatePowerups();
    if (player.alive) { updatePlayer(); updatePlayerBullets(); }
    updateEnemyBullets(); updateEnemies();
    if (bossActive && boss && boss.alive) updateBoss();
    processSpawnQueue(); updateBomb(); updateLaser(); updateNova();
    if (bombCooldown > 0) bombCooldown--;
    if (laserCooldown > 0) laserCooldown--;

    if ((keys['KeyR'] || keys['r'] || keys['R'] || mouse.rightDown) && !bombActive) {
      useBomb(); keys['KeyR'] = false; keys['r'] = false; keys['R'] = false;
    }
    if (keys['KeyX'] || keys['x'] || keys['X']) {
      useLaser(); keys['KeyX'] = false; keys['x'] = false; keys['X'] = false;
    }
    if (keys['KeyC'] || keys['c'] || keys['C']) {
      useNova(); keys['KeyC'] = false; keys['c'] = false; keys['C'] = false;
    }
    if (keys['Escape']) { keys['Escape'] = false; gameState = STATE.PAUSED; }

    applyScreenShake();
    drawBackground(); drawParticles(); drawPowerups();
    drawEnemies(); drawBoss(); drawEnemyBullets(); drawPlayerBullets(); drawBomb(); drawLaser(); drawNova();

    if (player.alive) {
      var invFlicker = player.invincible > 0 && Math.floor(player.invincible / 5) % 2 === 0;
      if (!invFlicker) {
        var focusMode = !!(keys['KeyZ'] || keys['ShiftLeft'] || keys['ShiftRight'] || keys['z'] || keys['Z']);
        drawPlayerShip(player.x, player.y, focusMode);
      }
    }

    drawScanlines(); drawHUD(); drawFloatingTexts();
    ctx.restore();
    return;
  }

  if (gameState === STATE.PAUSED) {
    drawBackground(); drawScanlines(); drawPauseScreen();
    ctx.restore();
    if (keys['Escape'] || keys['Space'] || keys[' '] || mouse.down) {
      keys['Escape'] = false; keys['Space'] = false; keys[' '] = false; mouse.down = false;
      gameState = STATE.PLAYING;
    }
    return;
  }

  if (gameState === STATE.STAGE_CLEAR) {
    stageClearTimer++;
    updateStars(); updateParticles();
    drawBackground(); drawParticles(); drawScanlines(); drawStageClear();
    ctx.restore();
    if (stageClearTimer > 120 && (mouse.down || keys['Space'] || keys[' '])) {
      mouse.down = false; nextStage();
    }
    return;
  }

  if (gameState === STATE.GAME_OVER) {
    gameOverTimer++;
    updateStars(); updateParticles();
    drawBackground(); drawParticles(); drawScanlines(); drawGameOver();
    ctx.restore();
    if (gameOverTimer > 120 && (mouse.down || keys['Space'] || keys[' '])) {
      mouse.down = false; gameState = STATE.MAP_SELECT;
    }
    return;
  }

  if (gameState === STATE.VICTORY) {
    updateStars(); updateParticles();
    drawBackground(); drawParticles(); drawScanlines(); drawVictory();
    ctx.restore();
    if (mouse.down || keys['Space'] || keys[' ']) {
      mouse.down = false;
      if (score > hiScore) hiScore = score;
      gameState = STATE.MENU;
    }
    return;
  }

  ctx.restore();
}

requestAnimationFrame(gameLoop);
</script>
